openapi: 3.1.0
info:
  title: ADR Forge Local API
  version: 0.1.0
  description: Localhost-only API for architecture scenario analysis and experiment review.
servers:
  - url: http://127.0.0.1:8000/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readiness:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Required local storage and configuration are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
  /system/resources:
    get:
      operationId: getSystemResources
      responses:
        "200":
          description: Sanitized disk, memory, and GPU capacity snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemResources"
  /integrations/knowledge-hub:
    get:
      operationId: getKnowledgeHubStatus
      responses:
        "200":
          description: Sanitized integration availability without credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatus"
  /strategies:
    get:
      operationId: listStrategies
      responses:
        "200":
          description: Configured analysis strategies and current availability.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategySummary"
  /retrieval-snapshots:
    post:
      operationId: createRetrievalSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRetrievalSnapshotRequest"
      responses:
        "201":
          description: Immutable snapshot created; an identical canonical snapshot may reuse existing content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalSnapshot"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "422":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
  /scenarios:
    post:
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScenarioRequest"
      responses:
        "201":
          description: Scenario and first immutable revision created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
        "422":
          $ref: "#/components/responses/ProblemResponse"
  /scenarios/{scenarioId}:
    get:
      operationId: getScenario
      parameters:
        - $ref: "#/components/parameters/ScenarioId"
      responses:
        "200":
          description: Scenario and current revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /scenarios/{scenarioId}/revisions:
    post:
      operationId: createScenarioRevision
      parameters:
        - $ref: "#/components/parameters/ScenarioId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRevisionRequest"
      responses:
        "201":
          description: New immutable revision created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioRevision"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          description: The supplied base revision is no longer the current scenario revision.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://adr-forge.local/problems/stale_revision
                title: Stale scenario revision
                status: 409
                code: stale_revision
                detail: Reload the scenario and deliberately rebase the clarification answers.
        "422":
          $ref: "#/components/responses/ProblemResponse"
  /analysis-runs:
    post:
      operationId: createAnalysisRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnalysisRunRequest"
      responses:
        "202":
          description: Run accepted and queued for the exclusive local executor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "422":
          $ref: "#/components/responses/ProblemResponse"
  /analysis-runs/{runId}:
    get:
      operationId: getAnalysisRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Current persisted run snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /analysis-runs/{runId}/events:
    get:
      operationId: streamAnalysisRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: >-
            Best-effort server-sent progress events. The first event is the current persisted
            snapshot, every data payload conforms to ProgressEvent, and the server closes the
            stream after a terminal status. Clients read persisted state before reconnecting and
            do not rely on replay.
          content:
            text/event-stream:
              schema:
                type: string
                examples:
                  - "event: progress\ndata: {\"run_id\":\"00000000-0000-0000-0000-000000000000\",\"status\":\"running\",\"stage\":\"generating\",\"progress_percent\":50,\"progress_sequence\":3,\"updated_at\":\"2026-10-12T12:00:00Z\"}\n\n"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /analysis-runs/{runId}/cancel:
    post:
      operationId: cancelAnalysisRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: Cooperative cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /analysis-runs/{runId}/adr:
    get:
      operationId: getRunAdr
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Validated structured ADR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdrDraft"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /analysis-runs/{runId}/export:
    get:
      operationId: exportRunAdr
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [markdown, json]
            default: markdown
      responses:
        "200":
          description: ADR export.
          headers:
            Content-Disposition:
              description: Safe local attachment filename for Markdown exports.
              schema: { type: string }
          content:
            text/markdown:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/AdrDraft"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /experiments:
    post:
      operationId: createExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExperimentRequest"
      responses:
        "201":
          description: Immutable experiment inputs registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "422":
          $ref: "#/components/responses/ProblemResponse"
  /experiments/{experimentId}:
    get:
      operationId: getExperiment
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      responses:
        "200":
          description: Experiment state and accounting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /experiments/{experimentId}/runs:
    get:
      operationId: listExperimentRuns
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      responses:
        "200":
          description: Every expected run and terminal or missing status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisRun"
  /experiments/{experimentId}/report:
    get:
      operationId: getExperimentReport
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      responses:
        "200":
          description: Consolidated reproducibility and result report.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /comparisons:
    post:
      operationId: createBlindComparison
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComparisonRequest"
      responses:
        "201":
          description: Blinded outputs with randomized labels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlindComparison"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "422":
          $ref: "#/components/responses/ProblemResponse"
  /comparisons/{comparisonId}:
    get:
      operationId: getBlindComparison
      parameters:
        - $ref: "#/components/parameters/ComparisonId"
      responses:
        "200":
          description: Blinded comparison; identities omitted before evaluation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlindComparison"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /comparisons/{comparisonId}/evaluation:
    post:
      operationId: submitBlindEvaluation
      parameters:
        - $ref: "#/components/parameters/ComparisonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitEvaluationRequest"
      responses:
        "201":
          description: Immutable initial evaluation or explicit superseding correction recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResult"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "422":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /comparisons/{comparisonId}/reveal:
    get:
      operationId: revealComparisonIdentities
      parameters:
        - $ref: "#/components/parameters/ComparisonId"
      responses:
        "200":
          description: Label-to-run and strategy mapping after evaluation submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonReveal"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
components:
  parameters:
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExperimentId:
      name: experimentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ComparisonId:
      name: comparisonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ProblemResponse:
      description: Problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        request_id: { type: string }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    ReadinessResponse:
      type: object
      required: [ready, checks]
      properties:
        ready: { type: boolean }
        checks:
          type: object
          additionalProperties: { type: boolean }
    SystemResources:
      type: object
      required: [disk, memory, gpu, artifact_budget]
      properties:
        disk: { type: object, additionalProperties: true }
        memory: { type: object, additionalProperties: true }
        gpu: { type: object, additionalProperties: true }
        artifact_budget: { type: object, additionalProperties: true }
        blockers:
          type: array
          items: { type: string }
    IntegrationStatus:
      type: object
      required: [name, available]
      properties:
        name: { type: string }
        available: { type: boolean }
        reason: { type: [string, "null"] }
        latency_ms: { type: [integer, "null"], minimum: 0 }
    StrategySummary:
      type: object
      required: [id, version, kind, model_id, model_revision, requires_retrieval, available]
      additionalProperties: false
      properties:
        id: { type: string }
        version: { type: string }
        kind:
          type: string
          enum: [base, prompted, rag, fine_tuned, fine_tuned_rag]
        model_id: { type: string }
        model_revision: { type: string }
        requires_retrieval: { type: boolean }
        available: { type: boolean }
        unavailable_reason: { type: [string, "null"] }
        unavailable_reason_code: { type: [string, "null"] }
    CreateRetrievalSnapshotRequest:
      type: object
      required: [provider, query, filters]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [knowledge_hub, fixture] }
        query: { type: string, minLength: 1, maxLength: 10000 }
        filters:
          $ref: "#/components/schemas/RetrievalFilters"
        fixture_id:
          type: [string, "null"]
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$"
          description: Server-configured fixture identity; never an arbitrary filesystem path.
    RetrievalFilters:
      type: object
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 1, maximum: 50, default: 8 }
        category_ids: { type: [array, "null"], items: { type: integer, minimum: 1 } }
        tag_ids: { type: [array, "null"], items: { type: integer, minimum: 1 } }
        project_ids: { type: [array, "null"], items: { type: integer, minimum: 1 } }
        min_score: { type: [number, "null"], minimum: 0, maximum: 1 }
    RetrievalSnapshot:
      type: object
      required: [id, schema_version, provider, provider_version, query, filters, embedding_model, embedding_version, content_hash, artifact_id, created_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        schema_version: { type: string }
        provider: { type: string, enum: [knowledge_hub, fixture] }
        provider_version: { type: string }
        query: { type: string }
        filters: { $ref: "#/components/schemas/RetrievalFilters" }
        embedding_model: { type: string }
        embedding_version: { type: string }
        content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        artifact_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    CreateScenarioRequest:
      type: object
      required: [title, language, problem]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        language: { type: string, const: pt-BR }
        problem: { type: string, minLength: 20, maxLength: 20000 }
        facts:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 2000 }
        constraints:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 2000 }
        desired_qualities:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
        candidate_alternatives:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
    CreateRevisionRequest:
      type: object
      additionalProperties: false
      required: [base_revision_number, clarification_answers]
      properties:
        base_revision_number: { type: integer, minimum: 1 }
        clarification_answers:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [question_id, answer, source_run_id]
            properties:
              question_id: { type: string, minLength: 1 }
              answer: { type: string, minLength: 1, maxLength: 5000 }
              source_run_id: { type: string, format: uuid }
    ScenarioRevision:
      type: object
      required: [id, scenario_id, revision_number, problem, facts, constraints, desired_qualities, candidate_alternatives, clarification_answers, categories, content_hash, created_at]
      properties:
        id: { type: string, format: uuid }
        scenario_id: { type: string, format: uuid }
        revision_number: { type: integer, minimum: 1 }
        problem: { type: string }
        facts: { type: array, maxItems: 50, items: { type: string } }
        constraints: { type: array, maxItems: 50, items: { type: string } }
        desired_qualities: { type: array, maxItems: 20, items: { type: string } }
        candidate_alternatives: { type: array, maxItems: 20, items: { type: string } }
        clarification_answers:
          type: array
          items:
            $ref: "#/components/schemas/ClarificationAnswer"
        categories:
          type: array
          minItems: 1
          uniqueItems: true
          description: Ordered supported matches, or exactly unsupported when no category matches.
          items: { $ref: "#/components/schemas/DecisionCategory" }
        content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        created_at: { type: string, format: date-time }
    ClarificationAnswer:
      type: object
      additionalProperties: false
      required: [question_id, question, impact, answer, source_run_id]
      properties:
        question_id: { type: string, minLength: 1 }
        question: { type: string, minLength: 1, maxLength: 2000 }
        impact: { type: string, minLength: 1, maxLength: 2000 }
        answer: { type: string, minLength: 1, maxLength: 5000 }
        source_run_id: { type: string, format: uuid }
    ScenarioResponse:
      type: object
      required: [id, title, language, current_revision]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        language: { type: string }
        current_revision: { $ref: "#/components/schemas/ScenarioRevision" }
    CreateAnalysisRunRequest:
      type: object
      required: [scenario_revision_id, strategy_id, strategy_version]
      properties:
        scenario_revision_id: { type: string, format: uuid }
        strategy_id: { type: string }
        strategy_version: { type: string }
        retrieval_snapshot_id: { type: [string, "null"], format: uuid }
        experiment_id: { type: [string, "null"], format: uuid }
    AnalysisRun:
      type: object
      required: [id, scenario_revision_id, strategy_id, strategy_version, scenario_content_hash, strategy_configuration_hash, generation_config_hash, status, stage, progress_sequence, validation_attempts, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        scenario_revision_id: { type: string, format: uuid }
        strategy_id: { type: string }
        strategy_version: { type: string }
        retrieval_snapshot_id: { type: [string, "null"], format: uuid }
        experiment_id: { type: [string, "null"], format: uuid }
        scenario_content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        strategy_configuration_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        generation_config_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        status:
          type: string
          enum: [pending, waiting_resources, running, completed, needs_clarification, invalid_output, failed, cancelled, interrupted]
        stage: { type: string }
        progress_percent: { type: [integer, "null"], minimum: 0, maximum: 100 }
        progress_sequence: { type: integer, minimum: 0 }
        raw_output_artifact_id: { type: [string, "null"], format: uuid }
        repaired_output_artifact_id: { type: [string, "null"], format: uuid }
        validation_attempts:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/OutputValidationAttempt" }
        adr_draft_id: { type: [string, "null"], format: uuid }
        failure_code: { type: [string, "null"] }
        failure_detail: { type: [string, "null"], maxLength: 2000 }
        input_tokens: { type: [integer, "null"], minimum: 0 }
        output_tokens: { type: [integer, "null"], minimum: 0 }
        latency_ms: { type: [integer, "null"], minimum: 0 }
        peak_vram_mb: { type: [integer, "null"], minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    ProgressEvent:
      type: object
      required: [run_id, status, stage, progress_sequence, updated_at]
      properties:
        run_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, waiting_resources, running, completed, needs_clarification, invalid_output, failed, cancelled, interrupted]
        stage: { type: string }
        progress_percent: { type: [integer, "null"], minimum: 0, maximum: 100 }
        progress_sequence: { type: integer, minimum: 0 }
        failure_code: { type: [string, "null"] }
        failure_detail: { type: [string, "null"], maxLength: 2000 }
        updated_at: { type: string, format: date-time }
    ValidationFinding:
      type: object
      required: [code, path, severity, message]
      additionalProperties: false
      properties:
        code: { type: string }
        path: { type: string }
        severity: { type: string, enum: [error, warning] }
        message: { type: string, maxLength: 2000 }
    OutputValidationAttempt:
      type: object
      required: [attempt, output_artifact_id, parse_succeeded, findings]
      additionalProperties: false
      properties:
        attempt: { type: string, enum: [original, repaired] }
        output_artifact_id: { type: string, format: uuid }
        parse_succeeded: { type: boolean }
        schema_version: { type: [string, "null"] }
        findings:
          type: array
          items: { $ref: "#/components/schemas/ValidationFinding" }
    AdrDraft:
      type: object
      required: [id, analysis_run_id, schema_version, title, status, context, facts, assumptions, unresolved_questions, constraints, alternatives, decision, rationale, positive_consequences, negative_consequences, risks, review_triggers, confidence, reference_ids, created_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        analysis_run_id: { type: string, format: uuid }
        schema_version: { type: string }
        title: { type: string, minLength: 3, maxLength: 200 }
        status: { type: string, enum: [provisional, proposed] }
        context: { type: array, minItems: 1, items: { type: string } }
        facts: { type: array, items: { type: string } }
        assumptions: { type: array, items: { $ref: "#/components/schemas/Assumption" } }
        unresolved_questions: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/UnresolvedQuestion" } }
        constraints: { type: array, items: { type: string } }
        alternatives: { type: array, items: { $ref: "#/components/schemas/Alternative" } }
        decision: { type: [string, "null"] }
        rationale: { type: array, items: { $ref: "#/components/schemas/RationaleLink" } }
        positive_consequences: { type: array, items: { type: string } }
        negative_consequences: { type: array, items: { type: string } }
        risks: { type: array, items: { $ref: "#/components/schemas/Risk" } }
        review_triggers: { type: array, items: { $ref: "#/components/schemas/ReviewTrigger" } }
        confidence: { type: number, minimum: 0, maximum: 1 }
        reference_ids: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
    Assumption:
      type: object
      required: [id, statement, impact, confidence]
      additionalProperties: false
      properties:
        id: { type: string }
        statement: { type: string }
        impact: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
    UnresolvedQuestion:
      type: object
      required: [id, question, impact]
      additionalProperties: false
      properties:
        id: { type: string }
        question: { type: string }
        impact: { type: string }
    Alternative:
      type: object
      required: [id, name, summary, viable, benefits, drawbacks, constraint_ids]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        summary: { type: string }
        viable: { type: boolean }
        rejection_reason: { type: [string, "null"] }
        benefits: { type: array, items: { type: string } }
        drawbacks: { type: array, items: { type: string } }
        constraint_ids:
          type: array
          items: { type: string, pattern: "^constraint:[0-9]+$" }
    RationaleLink:
      type: object
      required: [claim, evidence_kind, evidence_id]
      additionalProperties: false
      properties:
        claim: { type: string }
        evidence_kind: { type: string, enum: [fact, assumption, reference] }
        evidence_id:
          type: string
          description: A fact:N position, Assumption.id, or retrieval reference ID matching evidence_kind.
    Risk:
      type: object
      required: [description, likelihood, impact, mitigation]
      additionalProperties: false
      properties:
        description: { type: string }
        likelihood: { type: string, enum: [low, medium, high] }
        impact: { type: string, enum: [low, medium, high] }
        mitigation: { type: string }
    ReviewTrigger:
      type: object
      required: [metric, operator, threshold, unit]
      additionalProperties: false
      properties:
        metric: { type: string }
        operator: { type: string, enum: [gt, gte, lt, lte, eq] }
        threshold: { type: number }
        unit: { type: string }
    DecisionCategory:
      type: string
      enum:
        - sql_vs_nosql
        - sync_vs_async
        - modular_monolith_vs_microservices
        - containers_vs_serverless_vs_traditional
        - unsupported
    CreateExperimentRequest:
      type: object
      required: [name, scenario_revision_ids, strategy_refs, rubric_version_id, code_revision]
      properties:
        name: { type: string, minLength: 3, maxLength: 200 }
        scenario_revision_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        strategy_refs:
          type: array
          minItems: 2
          items:
            type: object
            required: [id, version]
            properties:
              id: { type: string }
              version: { type: string }
        dataset_version_id: { type: [string, "null"], format: uuid }
        rubric_version_id: { type: string, format: uuid }
        code_revision: { type: string, minLength: 7 }
    Experiment:
      type: object
      required: [id, name, status, rubric_version_id, code_revision, expected_run_count, completed_run_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [draft, running, completed, partial, failed, cancelled] }
        rubric_version_id: { type: string, format: uuid }
        code_revision: { type: string }
        expected_run_count: { type: integer, minimum: 1 }
        completed_run_count: { type: integer, minimum: 0 }
        failed_run_count: { type: integer, minimum: 0 }
        excluded_run_count: { type: integer, minimum: 0 }
    CreateComparisonRequest:
      type: object
      required: [run_ids, rubric_version_id]
      additionalProperties: false
      properties:
        run_ids:
          type: array
          minItems: 2
          uniqueItems: true
          items: { type: string, format: uuid }
        rubric_version_id: { type: string, format: uuid }
    BlindComparison:
      type: object
      required: [id, candidates, rubric, evaluated, current_evaluation_id]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        candidates:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/BlindedCandidate" }
        rubric: { $ref: "#/components/schemas/RubricDefinition" }
        evaluated: { type: boolean }
        current_evaluation_id: { type: [string, "null"], format: uuid }
    BlindedCandidate:
      type: object
      required: [label, adr]
      additionalProperties: false
      properties:
        label: { type: string, pattern: "^[A-Z][A-Z0-9]{0,7}$" }
        adr: { $ref: "#/components/schemas/BlindedAdrDraft" }
    BlindedAdrDraft:
      type: object
      description: Review content with all run, strategy, model, snapshot, artifact, and timing identity removed.
      required: [schema_version, title, status, context, facts, assumptions, unresolved_questions, constraints, alternatives, decision, rationale, positive_consequences, negative_consequences, risks, review_triggers, confidence, reference_ids]
      additionalProperties: false
      properties:
        schema_version: { type: string }
        title: { type: string, minLength: 3, maxLength: 200 }
        status: { type: string, enum: [provisional, proposed] }
        context: { type: array, minItems: 1, items: { type: string } }
        facts: { type: array, items: { type: string } }
        assumptions: { type: array, items: { $ref: "#/components/schemas/Assumption" } }
        unresolved_questions: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/UnresolvedQuestion" } }
        constraints: { type: array, items: { type: string } }
        alternatives: { type: array, items: { $ref: "#/components/schemas/Alternative" } }
        decision: { type: [string, "null"] }
        rationale: { type: array, items: { $ref: "#/components/schemas/RationaleLink" } }
        positive_consequences: { type: array, items: { type: string } }
        negative_consequences: { type: array, items: { type: string } }
        risks: { type: array, items: { $ref: "#/components/schemas/Risk" } }
        review_triggers: { type: array, items: { $ref: "#/components/schemas/ReviewTrigger" } }
        confidence: { type: number, minimum: 0, maximum: 1 }
        reference_ids: { type: array, items: { type: string } }
    RubricDefinition:
      type: object
      required: [id, name, version, content_hash, dimensions]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        dimensions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RubricDimension" }
    RubricDimension:
      type: object
      required: [key, description, minimum, maximum, anchors]
      additionalProperties: false
      properties:
        key: { type: string }
        description: { type: string }
        minimum: { type: integer }
        maximum: { type: integer }
        anchors:
          type: object
          additionalProperties: { type: string }
    SubmitEvaluationRequest:
      type: object
      required: [evaluator_id, evaluator_type, scores, preference]
      additionalProperties: false
      properties:
        evaluator_id: { type: string, minLength: 1, maxLength: 200 }
        evaluator_type: { type: string, enum: [human, llm_assisted, deterministic] }
        judge_model_identity:
          type: [object, "null"]
          additionalProperties: false
          properties:
            model_id: { type: string }
            model_revision: { type: string }
        scores:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: integer }
        preference: { type: string, description: Anonymous label or `tie` }
        notes: { type: string, maxLength: 5000 }
        supersedes_evaluation_id: { type: [string, "null"], format: uuid }
    EvaluationResult:
      type: object
      required: [id, comparison_id, rubric_version_id, evaluator_id, evaluator_type, scores, preference, supersedes_evaluation_id, submitted_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        comparison_id: { type: string, format: uuid }
        rubric_version_id: { type: string, format: uuid }
        evaluator_id: { type: string }
        evaluator_type: { type: string, enum: [human, llm_assisted, deterministic] }
        judge_model_identity:
          type: [object, "null"]
          additionalProperties: false
          properties:
            model_id: { type: string }
            model_revision: { type: string }
        scores: { type: object, additionalProperties: true }
        preference: { type: string }
        notes: { type: [string, "null"] }
        supersedes_evaluation_id: { type: [string, "null"], format: uuid }
        submitted_at: { type: string, format: date-time }
    ComparisonReveal:
      type: object
      required: [comparison_id, evaluation_id, candidates]
      additionalProperties: false
      properties:
        comparison_id: { type: string, format: uuid }
        evaluation_id: { type: string, format: uuid }
        candidates:
          type: array
          minItems: 2
          items:
            type: object
            required: [label, run_id, strategy_id, strategy_version, generation_config_hash]
            additionalProperties: false
            properties:
              label: { type: string }
              run_id: { type: string, format: uuid }
              strategy_id: { type: string }
              strategy_version: { type: string }
              retrieval_snapshot_id: { type: [string, "null"], format: uuid }
              generation_config_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
